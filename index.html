<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Answer Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top">
  <h1>Answer Tracker</h1>
  <div class="actions">
    <button id="btnGrid" class="ghost">Questions</button>
    <button id="btnExport" class="ghost">Export</button>
    <button id="btnKeys" class="ghost">Keys</button>
    <button id="btnTheme" class="ghost" aria-label="Toggle light or dark theme">Theme</button>
  </div>
</header>

<main>
  <!-- Setup -->
  <section id="setup" class="card">
    <h2>New session</h2>
    <form id="setupForm">
      <label>First question number
        <input id="inFirst" type="number" min="0" value="1" required>
      </label>
      <label>Number of questions
        <input id="inCount" type="number" min="1" placeholder="Leave empty for open-ended">
      </label>
      <label>Options per question
        <select id="inOptions">
          <option>2</option><option>3</option><option selected>4</option><option>5</option><option>6</option>
        </select>
      </label>
      <label>Option style
        <select id="inStyle">
          <option value="letters">A, B, C, D</option>
          <option value="numbers">1, 2, 3, 4</option>
          <option value="roman">I, II, III, IV</option>
        </select>
      </label>
      <button type="submit" class="primary">Start</button>
    </form>
  </section>

  <!-- Test -->
  <section id="test" class="card hidden">
    <div class="meta">
      <span id="progress"></span>
      <button id="btnNew" class="link">New session</button>
    </div>
    <div class="qnum">
      <span>Question</span>
      <strong id="qNum">1</strong>
      <span id="qStatus" class="muted"></span>
    </div>
    <div id="options" class="options"></div>
    <button id="btnSkip" class="skip">Skip question</button>
    <div class="nav">
      <button id="btnPrev">Previous</button>
      <button id="btnNext">Next</button>
    </div>
  </section>
</main>

<!-- Question grid -->
<dialog id="dlgGrid">
  <div class="dlg-head">
    <h2>Questions</h2>
    <button class="link" data-close>Close</button>
  </div>
  <div class="filters">
    <button data-filter="all" class="chip on">All</button>
    <button data-filter="skipped" class="chip">Skipped</button>
    <button data-filter="unanswered" class="chip">Not answered</button>
  </div>
  <div id="grid" class="grid"></div>
  <p class="muted small">Filled = answered. Dashed = skipped. Plain = not visited.</p>
</dialog>

<!-- Key mapping -->
<dialog id="dlgKeys">
  <div class="dlg-head">
    <h2>Key mapping</h2>
    <button class="link" data-close>Close</button>
  </div>
  <p class="muted small">Click a key, then press the key you want. Numpad keys work.</p>
  <div id="keyList" class="keylist"></div>
  <button id="btnResetKeys" class="link">Reset to defaults</button>
</dialog>

<!-- Export -->
<dialog id="dlgExport">
  <div class="dlg-head">
    <h2>Export answers</h2>
    <button class="link" data-close>Close</button>
  </div>
  <div class="export-choices">
    <button id="btnPdf" class="primary">Download PDF</button>
    <button id="btnCopy">Copy to clipboard</button>
  </div>
</dialog>

<div id="toast" class="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
